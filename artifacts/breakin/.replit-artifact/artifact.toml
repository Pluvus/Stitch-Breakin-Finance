kind = "web"
previewPath = "/"
title = "BreakIn"
version = "1.0.0"
id = "artifacts/breakin"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21276

[services.development]
run = "pnpm --filter @workspace/breakin run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/breakin", "run", "build" ]
publicDir = "artifacts/breakin/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21276"
BASE_PATH = "/"
